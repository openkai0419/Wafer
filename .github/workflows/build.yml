name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        run: python scripts/build.py

      - name: Verify build output
        run: |
          @(
            'dist/Wafer/python/wafer-python.exe',
            'dist/Wafer/main.py',
            'dist/Wafer/Wafer.exe',
            'dist/Wafer/LICENSE',
            'dist/Wafer/COPYING',
            'dist/Wafer/COPYING.LESSER',
            'dist/Wafer/README.md',
            'dist/Wafer/README.jp.md',
            'dist/Wafer/RELEASE_NOTES.md',
            'dist/Wafer/CHANGELOG.md',
            'dist/Wafer/THIRD-PARTY-NOTICES.txt',
            'dist/Wafer/extensions',
            'dist/Wafer/_resources'
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing: $_" }
          }

      - name: Smoke test
        run: |
          $proc = Start-Process -FilePath dist/Wafer/python/wafer-python.exe -ArgumentList "main.py","--version" -WorkingDirectory dist/Wafer -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw "timed out" }
          if ($proc.ExitCode -ne 0) { throw "exited with code $($proc.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wafer-${{ github.ref_name || github.sha }}
          path: dist/Wafer/
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Wafer-${{ github.ref_name || github.sha }}
          path: Wafer

      - name: Extract release notes
        run: python scripts/extract_release_notes.py RELEASE_NOTES.md release-notes.md ${{ github.ref_name }}

      - name: Create zip
        run: |
          cd Wafer
          zip -r ../Wafer-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Wafer-${{ github.ref_name }}.zip
          body_path: release-notes.md
