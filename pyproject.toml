[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -p pytestqt"
timeout = 30

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "Windows"
include = ["wayfer"]
typeCheckingMode = "off"
reportMissingModuleSource = false
reportMissingImports = "error"
reportMissingTypeStubs = false
