[project]
name = "wafer"
version = "0.1.0"
description = "Extensible local file viewer with plugin-based format support"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -p pytestqt -m 'not benchmark and not slow' --tb=short"
timeout = 30
timeout_method = "thread"
qt_default_raising = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: performance benchmarks (deselect with '-m \"not benchmark\"')",
    "unstable: tests that may crash the process (e.g. native mpv). skipped unless --run-unstable is given",
]

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "Windows"
include = ["wafer"]
typeCheckingMode = "off"
reportMissingModuleSource = false
reportMissingImports = "error"
reportMissingTypeStubs = false
