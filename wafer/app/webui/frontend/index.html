<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wafer WebUI</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="conn-banner" class="hidden">No response from server</div>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <button id="settings-btn" title="settings" aria-label="settings"></button>
      <select id="db-select"></select>
    </div>
    <div id="folder-tree"></div>
  </aside>
  <main id="main">
    <header id="toolbar">
      <button id="sidebar-toggle" title="toggle sidebar" aria-label="toggle sidebar"></button>
      <button id="key-picker" title="search options" aria-label="search options"></button>
      <input id="search-input" type="search" placeholder="search...">
      <select id="sort-select"></select>
      <button id="order-toggle" title="sort order" aria-label="sort order"></button>
      <span id="status"></span>
      <div id="key-popup" class="hidden">
        <div id="search-options">
          <div id="keyword-mode" class="segmented">
            <button data-mode="AND">AND</button>
            <button data-mode="OR">OR</button>
          </div>
          <label id="separator-field">split text by:
            <input id="keyword-separator" type="text" maxlength="4">
          </label>
        </div>
        <div id="key-selected"></div>
        <input id="key-search" type="search" placeholder="filter keys...">
        <div id="key-catalog"></div>
      </div>
    </header>
    <div id="grid-scroll">
      <div id="grid-canvas"></div>
    </div>
  </main>
</div>
<div id="viewer" class="hidden">
  <div id="viewer-main">
    <div id="viewer-stage"></div>
    <div id="viewer-caption"></div>
    <button id="viewer-prev" title="previous" aria-label="previous"></button>
    <button id="viewer-next" title="next" aria-label="next"></button>
    <button id="viewer-menu" title="menu" aria-label="menu"></button>
    <button id="viewer-info" title="info" aria-label="info"></button>
    <button id="viewer-close" title="close" aria-label="close"></button>
    <div id="viewer-menu-popup" class="hidden"></div>
  </div>
  <aside id="meta-panel" class="hidden">
    <div id="meta-content"></div>
  </aside>
</div>
<div id="settings-modal" class="hidden">
  <div id="settings-panel">
    <div id="settings-title">Settings</div>
    <label class="settings-row">thumbnail size (px)
      <select id="thumb-size"></select>
    </label>
    <div class="settings-row">auto scroll
      <button id="auto-scroll-toggle">off</button>
    </div>
    <label class="settings-row">auto scroll speed (px/s)
      <input id="auto-scroll-speed" type="range" min="0" step="1">
      <input id="auto-scroll-speed-value" type="number" min="5" max="500" step="1">
    </label>
  </div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
